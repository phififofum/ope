; Export presets for PoggyWoggy.
;
; Two targets for v1: Linux and Windows desktop. Both are built from a clean
; checkout in CI (.github/workflows/release.yml) and uploaded to a Steam branch.
;
; `embed_pck` is on for both targets: the build is one file you can hand to someone,
; with nothing beside it to lose.
;
; Keep `include_filter` in sync with anything that is read at runtime with
; FileAccess rather than loaded as a resource — content JSON above all. A missing
; entry here is invisible in the editor and fatal in an exported build.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json,content/**/*.json,mods/**/*.json,LICENSE,CREDITS.md"
exclude_filter="*.md.license.json"
export_path="build/linux/poggywoggy.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
debug/export_console_wrapper=1

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json,content/**/*.json,mods/**/*.json,LICENSE,CREDITS.md"
exclude_filter="*.md.license.json"
export_path="build/windows/poggywoggy.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
debug/export_console_wrapper=1
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="PoggyWoggy contributors"
application/product_name="PoggyWoggy"
application/file_description="PoggyWoggy"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
