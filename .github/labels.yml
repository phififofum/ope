# Labels as data, reviewable like anything else.
# Apply with: gh label create "<name>" --color <color> --description "<desc>" --force
# (or any label-sync action, run manually — we do not auto-sync on push.)

# --- Type -------------------------------------------------------------------
- name: bug
  color: d73a4a
  description: Something behaves incorrectly
- name: design
  color: 8b5cf6
  description: A proposal or argument about the specification
- name: content
  color: 0e8a16
  description: Definitions, schemas and game data
- name: documentation
  color: 0075ca
  description: Docs are wrong, missing, unclear or unfindable
- name: task
  color: 1d76db
  description: A unit of work from the work order
- name: dependencies
  color: 5319e7
  description: Dependency updates

# --- Triage -----------------------------------------------------------------
- name: needs-triage
  color: ededed
  description: Not yet looked at by a maintainer
- name: needs-info
  color: fbca04
  description: Waiting on the reporter
- name: blocked-by-gate
  color: b60205
  description: Correct work, wrong phase — parked until the gate passes
- name: spec-deviation
  color: e99695
  description: Departs from the design brief; needs an ADR
- name: breaking-change
  color: b60205
  description: Changes the public mod API — schemas, event names or payloads

# --- Invitation -------------------------------------------------------------
- name: good first issue
  color: 7057ff
  description: Self-contained, well-specified, no hidden context
- name: help wanted
  color: 008672
  description: Maintainers are not working on this and would like someone to

